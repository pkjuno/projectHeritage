name: project_heritage_frontend
description: "Project Heritage - Flutter 프론트엔드 애플리케이션"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 아이콘 팩
  cupertino_icons: ^1.0.6

  # 백엔드 REST API 통신용 HTTP 클라이언트
  http: ^1.2.1

  # JWT Access/Refresh Token을 안전하게 로컬에 저장하기 위한 보안 스토리지
  flutter_secure_storage: ^9.2.2

  # 프로필 이미지 선택(갤러리/카메라)용 이미지 피커
  image_picker: ^1.1.2

  # 구글 간편로그인 SDK
  google_sign_in: ^6.2.1

  # 카카오 간편로그인 SDK (사용 전 KakaoSdk.init(nativeAppKey: ...) 초기화 필요)
  kakao_flutter_sdk_user: ^1.9.3+2

  # 네이버 간편로그인 SDK (사용 전 clientId/clientSecret 초기화 필요)
  flutter_naver_login: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 코드 스타일/린트 규칙
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
